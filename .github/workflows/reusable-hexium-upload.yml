# Reusable workflow: publish a release to Hexium.gg.
#
# Single source of the logic (publish-hexium.py included, fetched from
# orax-modding/publish): other repos only call this file,
# see REUSING.md for the ~10-line caller template to copy.
name: Hexium upload (reusable)

on:
  workflow_call:
    inputs:
      asset:
        description: "Zip to publish; empty = <repo-name>.zip"
        type: string
        default: ""
      tag:
        description: "Tag to publish; empty = the release that triggered the call"
        type: string
        default: ""
      team:
        description: "Hexium namespace (author_name); empty = [package] namespace from hexium.toml"
        type: string
        default: ""
      config:
        description: "Config read by publish-hexium.py; empty = hexium.toml when present"
        type: string
        default: ""
      tools_ref:
        description: "Ref of orax-modding/publish carrying publish-hexium.py (keep equal to the calling ref)"
        type: string
        default: "v1"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Forwarded from the caller via secrets: inherit — Hexium team token
      # (team settings -> "create a new API token").
      HEXIUM_TCLI_AUTH_TOKEN: ${{ secrets.HEXIUM_TCLI_AUTH_TOKEN }}
      HEXIUM_TEAM: ${{ inputs.team }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      ASSET: ${{ inputs.asset || format('{0}.zip', github.event.repository.name) }}

    steps:
      - name: Checkout the calling project
        uses: actions/checkout@v7.0.1

      - name: Checkout orax-modding/publish (publish-hexium.py)
        uses: actions/checkout@v7.0.1
        with:
          repository: orax-modding/publish
          ref: ${{ inputs.tools_ref }}
          path: .publish-tools

      - name: Download release asset
        run: |
          gh release download "$TAG" --pattern "$ASSET" --dir dist
          ls dist/

      # Python 3 is preinstalled on the runner; the script is stdlib-only and
      # reads hexium.toml from the calling project.
      - name: Publish to Hexium
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          args=()
          [ -z "$CONFIG" ] || args+=(--config "$CONFIG")
          python3 .publish-tools/publish-hexium.py "dist/$ASSET" "${args[@]}"
