name: Upload to Nexus Mods

# Appelant local : toute la logique vit dans nexusmods-upload.yml (workflow
# réutilisable). Dans un autre dépôt, remplacez "uses: ./.github/…" par
# "uses: orax-modding/publish/.github/workflows/nexusmods-upload.yml@v1"
# (modèle complet dans REUTILISATION.md).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload:
    uses: ./.github/workflows/nexusmods-upload.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
      file_id: ${{ vars.NEXUSMODS_FILE_ID }}
    secrets: inherit
