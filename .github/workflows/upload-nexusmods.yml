name: Upload to Nexus Mods

# Local caller: all the logic lives in reusable-nexusmods-upload.yml (the reusable
# workflow). In another repo, replace "uses: ./.github/…" with
# "uses: orax-modding/publish/.github/workflows/reusable-nexusmods-upload.yml@v1"
# (complete template in REUSING.md).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload:
    uses: ./.github/workflows/reusable-nexusmods-upload.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
      file_id: ${{ vars.NEXUSMODS_FILE_ID }}
    secrets: inherit
