# Reusable workflow: publish a release to Nexus Mods.
#
# Other repos only call this file (see README.md) and provide
# NEXUSMODS_MOD_ID / NEXUSMODS_FILE_ID (repository variables, unique per mod)
# plus NEXUSMODS_API_KEY (secret, best kept at the organization level).
name: Nexus Mods upload (reusable)

on:
  workflow_call:
    inputs:
      asset:
        description: "Zip to publish; empty = <repo-name>.zip"
        type: string
        default: ""
      tag:
        description: "Tag to publish; empty = the release that triggered the call"
        type: string
        default: ""
      mod_id:
        description: "Mod ID on Nexus Mods (NEXUSMODS_MOD_ID)"
        type: string
        required: true
      file_id:
        description: "Master file ID on Nexus Mods (NEXUSMODS_FILE_ID)"
        type: string
        required: true
      display_name:
        description: "Name displayed on Nexus; empty = dist/<repo-name>"
        type: string
        default: ""
      update_mod_version:
        description: "Create/update the mod version on every release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      ASSET: ${{ inputs.asset || format('{0}.zip', github.event.repository.name) }}
      MOD_ID: ${{ inputs.mod_id }}
      FILE_ID: ${{ inputs.file_id }}

    steps:
      - name: Checkout the calling project
        uses: actions/checkout@v7.0.1

      - name: Check the configuration
        run: |
          missing=""
          [ -n "$MOD_ID" ]  || missing="$missing NEXUSMODS_MOD_ID"
          [ -n "$FILE_ID" ] || missing="$missing NEXUSMODS_FILE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variable(s):$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Download release asset
        run: |
          gh release download "$TAG" --pattern "$ASSET" --dir dist
          ls dist/

      - name: Get changelog
        id: changelog
        run: |
          #TODO: Nexus-specific formatting if needed. By default this sends
          # the body of the tag's release, written when the release was created.
          {
            echo "changelog<<CHANGELOG_EOF"
            gh release view "$TAG" --json body -q '.body // ""'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ inputs.file_id }}
          filename: dist/${{ inputs.asset || format('{0}.zip', github.event.repository.name) }}
          version: ${{ inputs.tag || github.event.release.tag_name }}
          mod_id: ${{ inputs.mod_id }}
          display_name: ${{ inputs.display_name || format('dist/{0}', github.event.repository.name) }}
          update_mod_version: ${{ inputs.update_mod_version }}
          changelog: ${{ steps.changelog.outputs.changelog }}
