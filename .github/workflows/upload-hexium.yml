name: Upload to Hexium.gg

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.0)"
        required: true
        default: "v0.0.0"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      # Needed by "gh release download" (GitHub runners also read GITHUB_TOKEN).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TCLI_AUTH_TOKEN: ${{ secrets.HEXIUM_TCLI_AUTH_TOKEN }}
      # workflow_dispatch input when run manually, release tag otherwise.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # tcli 0.2.4 targets .NET 6 (required); 10.x kept available as well.
          dotnet-version: |
            6.0.x
            10.x

      - name: Download release asset
        run: |
          gh release download "$TAG" --pattern "${{ github.event.repository.name }}.zip" --dir dist
          ls dist/

      - name: Publish to Hexium
        run: |
          dotnet tool restore
          dotnet tcli publish --config-path hexium.toml --file "dist/${{ github.event.repository.name }}.zip"
