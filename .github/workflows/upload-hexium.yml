name: Upload to Hexium.gg

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.0)"
        required: true
        default: "v0.0.0"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      # Needed by "gh release download" (GitHub runners also read GITHUB_TOKEN).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Hexium team API token (team settings page -> "create a new API token").
      HEXIUM_TCLI_AUTH_TOKEN: ${{ secrets.HEXIUM_TCLI_AUTH_TOKEN }}
      # Publishing namespace; override with the HEXIUM_TEAM repository variable.
      HEXIUM_TEAM: ${{ vars.HEXIUM_TEAM || 'orax' }}
      # workflow_dispatch input when run manually, release tag otherwise.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download release asset
        run: |
          gh release download "$TAG" --pattern "${{ github.event.repository.name }}.zip" --dir dist
          ls dist/

      # Python 3 is preinstalled on the runner; publish-hexium.py is stdlib only.
      - name: Publish to Hexium
        run: python3 publish-hexium.py "dist/${{ github.event.repository.name }}.zip"
