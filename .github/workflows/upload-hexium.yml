name: Upload to Hexium.gg

# Appelant local : toute la logique vit dans hexium-upload.yml (workflow
# réutilisable). Dans un autre dépôt, remplacez "uses: ./.github/…" par
# "uses: orax-modding/publish/.github/workflows/hexium-upload.yml@v1"
# (modèle complet dans REUTILISATION.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.0)"
        required: true
        default: "v0.0.0"

permissions:
  contents: read

jobs:
  upload:
    uses: ./.github/workflows/hexium-upload.yml
    with:
      # workflow_dispatch input when run manually, release tag otherwise.
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      # Namespace Hexium ; vide = [package] namespace de hexium.toml.
      team: ${{ vars.HEXIUM_TEAM }}
    secrets: inherit
