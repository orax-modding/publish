name: Upload to Hexium.gg

# Local caller: all the logic lives in reusable-hexium-upload.yml (the reusable
# workflow). In another repo, replace "uses: ./.github/…" with
# "uses: orax-modding/publish/.github/workflows/reusable-hexium-upload.yml@v0.1"
# (complete template in README.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.0)"
        required: true
        default: "v0.0.0"

permissions:
  contents: read

jobs:
  upload:
    uses: ./.github/workflows/reusable-hexium-upload.yml
    with:
      # workflow_dispatch input when run manually, release tag otherwise.
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      # Hexium namespace; empty = [package] namespace from hexium.toml.
      team: ${{ vars.HEXIUM_TEAM }}
    secrets: inherit
